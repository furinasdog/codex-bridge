name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build dashboard
        run: |
          npm ci --prefix web
          npm run --prefix web typecheck
          npm run --prefix web build

      - name: Build release archives
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release staging

          build_archive() {
            os="$1"
            arch="$2"
            name="codex-bridge_${VERSION}_${os}_${arch}"
            directory="staging/${name}"
            binary="codex-bridge"
            if [ "$os" = "windows" ]; then
              binary="codex-bridge.exe"
            fi

            mkdir -p "$directory"
            GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "${directory}/${binary}" \
              ./cmd/codex-bridge
            cp README.md LICENSE "${directory}/"

            if [ "$os" = "windows" ]; then
              (cd staging && zip -q -r "../release/${name}.zip" "$name")
            else
              tar -C staging -czf "release/${name}.tar.gz" "$name"
            fi
          }

          build_archive linux amd64
          build_archive linux arm64
          build_archive darwin amd64
          build_archive darwin arm64
          build_archive windows amd64
          build_archive windows arm64

          (cd release && sha256sum ./* > SHA256SUMS)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
